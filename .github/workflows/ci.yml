name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install GDAL system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev python3-dev
          gdal-config --version

      - name: Install CJK fonts for map labels (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y fonts-noto-cjk

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Show GDAL / rasterio versions
        run: python -c "import rasterio; print('rasterio', rasterio.__version__); print('GDAL', rasterio.__gdal_version__)"

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -q

      - name: CLI smoke test
        shell: bash
        run: |
          rusle --help > /dev/null
          rusle demo -o smoke_out
          test -s smoke_out/erosion.tif
          test -s smoke_out/erosion-map.png
          test -s smoke_out/summary.json
          rusle run examples/demo/dem.tif examples/demo/params.yaml -o smoke_run
          test -s smoke_run/slope-class-stats.csv

      - name: Upload demo map
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: demo-map
          path: smoke_out/erosion-map.png
          if-no-files-found: error
